services:
  - type: web
    name: lumina-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_IMAGE_PIXELS
        value: "24000000"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ZERODCE_SCALE
        value: "12"
      - key: MAX_INFERENCE_SIDE
        value: "1280"
